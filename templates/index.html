<!DOCTYPE html>
<html>
<head>
    <title>{{ text.title }}</title>
    <style>
        .category-btn {
            padding: 10px 20px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
        }

        .search-container {
            margin-top: 20px;
        }

        .search-input {
            padding: 10px;
            font-size: 16px;
            width: 300px;
        }
    </style>
</head>
<body>

    <!-- Language Dropdown -->
    <form action="/set_language" method="POST" style="position:absolute; top:10px; right:10px;">
        <label>{{ text.lang_label }}:</label>
        <select name="language" onchange="this.form.submit()">
            <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
            <option value="es" {% if lang == 'es' %}selected{% endif %}>Español</option>
        </select>
    </form>

    <h1>{{ text.title }}</h1>
    <p>{{ text.subtitle }}</p>

    <!-- Search Bar -->
    <div class="search-container">
        <input class="search-input" type="text" placeholder="{{ text.search_placeholder }}">
    </div>

    <!-- Category Buttons -->
    <div>
        <button class="category-btn">{{ text.health }}</button>
        <button class="category-btn">{{ text.food }}</button>
        <button class="category-btn">{{ text.housing }}</button>
    </div>

</body>
</html>
